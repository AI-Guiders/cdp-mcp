# Project quality gates overlay (wins over host cdp-mcp.toml [quality]).
# Discuss/tune here — not carved in stone.
# file_lines warn → OOA&D / DRY / KISS (real types). partial = narrow case (codegen/designer).
# suggest_sniper=0: SA alert counts unique open buffers; sniper band (180..warn)
# was double-noise next to real file_lines when the desk keeps many mid-size files open.
# partial_family_*: tooth vs file_lines peel mill (partial ≠ seam). Brain still required.
# file_lines on open buffers: code kinds only (.cs/.fs/.ts/…); prose (.md) skipped — see QualityGates.CodeKinds.cs
[quality]
enabled = true
mode = "warn"

[quality.gates]
file_lines_warn = 350
file_lines_fail = 700
method_lines_warn = 70
method_lines_fail = 120
suggest_sniper_file_lines = 0
partial_family_files_warn = 4
partial_family_files_fail = 0
