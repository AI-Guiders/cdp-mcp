# Embedded CDP defaults (ADR-0222/0224). Operator file overlays only diffs.
version = 1
default_phase = "recall"
default_object = "kb"

[memory.world]
enabled = true
roots = ["worlds", "META", "."]

[memory.project]
enabled = true
roots = ["work/projects", "personal"]

[memory.task]
enabled = true

[memory.session]
enabled = true

[memory.skill]
enabled = true
roots = ["domains", "templates"]

[memory.self.finding]
enabled = true

[memory.self.failure]
enabled = true

[dev.debug]
enabled = true

[dev.build]
enabled = true

[dev.roslyn]
enabled = true

[dev.git]
enabled = true

[dev.codebase_index]
enabled = true

[dev.anui]
enabled = true

[citizen]
enabled = false

[languages]
ids = ["csharp", "typescript", "python", "delphi", "powershell"]

[tower]
listen_port = 8771

[slots]
enabled = true
bind = "127.0.0.1"

[bridge]
base_url = "http://127.0.0.1:8771"

[tools]
# rg = ""  # optional; default: probe CDP_RG env → PATH → habitat bin → winget → Cursor rg
