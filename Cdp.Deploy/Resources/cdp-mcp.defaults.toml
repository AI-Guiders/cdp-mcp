# Embedded CDP defaults (ADR-0222/0224). Operator file overlays only diffs.
version = 1
default_phase = "recall"
default_object = "kb"

[memory.world]
enabled = true
roots = ["worlds", "META", "."]

[memory.project]
enabled = true
roots = ["work/projects", "personal"]

[memory.task]
enabled = true

[memory.session]
enabled = true

[memory.skill]
enabled = true
roots = ["domains", "templates"]

[memory.self.finding]
enabled = true

[memory.self.failure]
enabled = true

[dev.debug]
enabled = true

[dev.build]
enabled = true

[dev.roslyn]
enabled = true

[dev.git]
enabled = true

[dev.codebase_index]
enabled = true

[dev.anui]
enabled = true

[citizen]
enabled = false

[languages]
ids = ["csharp", "typescript", "python", "delphi", "powershell"]

[tower]
listen_port = 8771

[slots]
enabled = true
bind = "127.0.0.1"

[bridge]
base_url = "http://127.0.0.1:8771"
composer = "main"
capabilities_poll_ms = 2000
deploy_wait_ms = 180000
deploy_poll_ms = 500
deploy_gap_retry_ms = 750
service_ready_ms = 15000

[tenant]
idle_ttl_minutes = 45

[ops]
explore_corr_enabled = true
shell_ignite_arm = true
lifecycle_ignite_arm = true
tool_wake_arm = true
oom_wake_cdt_edge = false

[tools]
# rg = ""
# plugins_root = ""
# openvsx_base = "https://open-vsx.org"

[forum]
