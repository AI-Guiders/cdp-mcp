name: Release win-x64

on:
  # Tag v* when GH_PAT + GITLAB_TOKEN/GITLAB_CLONE_URL exist; until then dispatch only
  # (GitHub-hosted runners do not see the local open/ tree).
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag (empty = upload artifact only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-win:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: cdp-mcp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout siblings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_CLONE_URL: ${{ secrets.GITLAB_CLONE_URL }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./cdp-mcp/scripts/ci-checkout-siblings.ps1

      - name: Package win-x64 zip
        shell: pwsh
        run: ./cdp-mcp/scripts/package-win-release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdp-win-x64
          path: |
            cdp-mcp/artifacts/dist/*.zip
            cdp-mcp/artifacts/dist/Install-Cdp.ps1
            cdp-mcp/artifacts/dist/SHA256SUMS

      - name: GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            cdp-mcp/artifacts/dist/*.zip
            cdp-mcp/artifacts/dist/Install-Cdp.ps1
            cdp-mcp/artifacts/dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
